# Конфигурация Supervisor для Gunicorn
# Скопировать в /etc/supervisor/conf.d/profsouz.conf
# Команды:
#   supervisorctl reread
#   supervisorctl update
#   supervisorctl start profsouz
#   supervisorctl status profsouz

[program:profsouz]
command=/var/www/profsouz/venv/bin/gunicorn profsouz.wsgi:application --bind 127.0.0.1:8000 --workers 3 --threads 2 --timeout 120 --log-level info --access-logfile /var/log/gunicorn/profsouz_access.log --error-logfile /var/log/gunicorn/profsouz_error.log
directory=/var/www/profsouz
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/profsouz_stdout.log
environment=DJANGO_SETTINGS_MODULE="profsouz.settings"

