# Конфигурация Nginx для profsouz.kz
# Скопировать в /etc/nginx/sites-available/profsouz
# Создать симлинк: ln -s /etc/nginx/sites-available/profsouz /etc/nginx/sites-enabled/
# Удалить default: rm /etc/nginx/sites-enabled/default

# HTTP конфигурация (до получения SSL сертификата)
server {
    listen 80;
    listen [::]:80;
    server_name profsouz.kz www.profsouz.kz;
    
    # Для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Максимальный размер загружаемых файлов
    client_max_body_size 100M;

    # Логи
    access_log /var/log/nginx/profsouz_access.log;
    error_log /var/log/nginx/profsouz_error.log;

    # Статические файлы
    location /static/ {
        alias /var/www/profsouz/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы
    location /media/ {
        alias /var/www/profsouz/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Проксирование на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS конфигурация (будет добавлена автоматически certbot после получения сертификата)
# После получения SSL сертификата certbot автоматически добавит блок server для 443 порта
