# Конфигурация Nginx для profsouz.com
# Скопировать в /etc/nginx/sites-available/profsouz
# Создать симлинк: ln -s /etc/nginx/sites-available/profsouz /etc/nginx/sites-enabled/
# Удалить default: rm /etc/nginx/sites-enabled/default

# Редирект с HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name profsouz.com www.profsouz.com;
    
    # Для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Редирект на HTTPS (после получения сертификата)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS конфигурация
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name profsouz.com www.profsouz.com;

    # SSL сертификаты (будут добавлены certbot)
    # После получения сертификата раскомментируйте эти строки:
    # ssl_certificate /etc/letsencrypt/live/profsouz.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/profsouz.com/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Максимальный размер загружаемых файлов
    client_max_body_size 100M;

    # Логи
    access_log /var/log/nginx/profsouz_access.log;
    error_log /var/log/nginx/profsouz_error.log;

    # Статические файлы
    location /static/ {
        alias /var/www/profsouz/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы
    location /media/ {
        alias /var/www/profsouz/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Проксирование на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
